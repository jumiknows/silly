name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check game.js
      - name: Check required files
        run: |
          test -f index.html
          test -f styles.css
          grep -q 'styles.css' index.html
          grep -q 'game.js' index.html
